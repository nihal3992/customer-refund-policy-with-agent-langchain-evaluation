[project]
name = "aiagente"
version = "0.1.0"
description = "An inspectable, policy-driven AI refund platform with trace-based evaluation"
readme = "README.md"
authors = [
    { name = "nihal.mc", email = "nihal.mc@zohocorp.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepeval>=4.3.1",
    "fastapi>=0.116",
    "itsdangerous>=2.2",
    "langchain>=1.4.6",
    "langchain-core>=1.2",
    "langchain-openai>=1.7.2",
    "langgraph>=1.0",
    "openai>=2.0",
    "pydantic>=2.11",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
aiagente = "agent.cli:main"
aiagente-eval = "evaluation.eval_all:main"

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.3", "ruff>=0.11"]

[tool.uv.build-backend]
module-root = ""
module-name = ["agent", "api", "evaluation"]
source-include = [
    "frontend/src/**",
    "frontend/index.html",
    "frontend/package.json",
    "frontend/package-lock.json",
    "frontend/tsconfig*.json",
    "frontend/vite.config.ts",
    "frontend/eslint.config.js",
    ".env.example",
    "Dockerfile",
    "tests/**",
    ".github/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
