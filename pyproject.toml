[project]
name = "aiagente"
version = "0.1.0"
description = "A tool-driven refund assistant with a local web demo and trace-based LLM evaluation"
readme = "README.md"
authors = [
    { name = "nihal.mc", email = "nihal.mc@zohocorp.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepeval>=4.3.1",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "python-dotenv>=1.0.1",
    "streamlit>=1.45",
]

[project.scripts]
aiagente = "agent.cli:main"
aiagente-eval = "evaluation.eval_all:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.uv.build-backend]
module-root = ""
module-name = ["agent", "evaluation"]
source-include = ["app.py", ".env.example", ".streamlit/**", "tests/**", ".github/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
